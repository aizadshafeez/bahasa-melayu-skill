<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="473" viewBox="0 0 1200 473" role="img" aria-label="Same model, same request: a customer complaint reply without and with the skill">
<rect width="1200" height="473" rx="20" fill="#f6f7f5"/>
<text x="56" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b6b66" text-anchor="start">SAME MODEL, SAME REQUEST</text>
<text x="56" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#16201f" text-anchor="start">Customer: “Order saya 5 hari tak sampai lagi. Ni scam ke?”</text>
<rect x="56" y="140" width="532" height="219" rx="16" fill="none" stroke="#dfe4e2"/>
<rect x="56" y="140" width="532" height="219" rx="16" fill="#ffffff"/>
<text x="78" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b68" text-anchor="start">WITHOUT THE SKILL</text>
<text x="78" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">Salam, maaf sangat atas kelewatan ni. Bukan</text>
<text x="78" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">scam ya. Saya dah semak tracking, parcel</text>
<text x="78" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">tersangkut di hub Pos Laju Shah Alam.</text>
<text x="78" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">Dijangka sampai esok. Kalau esok masih tak</text>
<text x="78" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">sampai, saya refund caj pos tu.</text>
<rect x="612" y="140" width="532" height="188" rx="16" fill="none" stroke="#0b6b66" stroke-width="2"/>
<rect x="612" y="140" width="532" height="188" rx="16" fill="#ffffff"/>
<text x="634" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b6b66" text-anchor="start">WITH THE SKILL</text>
<text x="634" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">Maaf cik, bukan scam ye. Saya dah check,</text>
<text x="634" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">parcel cik tersangkut kat hub Pos Laju</text>
<text x="634" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">Shah Alam. Sepatutnya esok sampai. Kalau</text>
<text x="634" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#16201f" text-anchor="start">esok tak sampai juga, saya refund kos pos.</text>
<text x="56" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8322a" text-anchor="start">✕  “Dijangka sampai esok”: notice-board passive</text>
<text x="612" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b6b66" text-anchor="start">✓  Talks to the customer: “cik”</text>
<text x="56" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8322a" text-anchor="start">✕  “di hub”, “semak”: written Malay, not chat</text>
<text x="612" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b6b66" text-anchor="start">✓  Chat wording: “kat”, “check”, “sepatutnya”</text>
</svg>