<text x="56" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ff8f85" text-anchor="start">✕  “Dijangka sampai esok”: notice-board passive</text>
<text x="612" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5ccfc4" text-anchor="start">✓  Talks to the customer: “cik”</text>
<text x="56" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ff8f85" text-anchor="start">✕  “di hub”, “semak”: written Malay, not chat</text>
<text x="612" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5ccfc4" text-anchor="start">✓  Chat wording: “kat”, “check”, “sepatutnya”</text>
