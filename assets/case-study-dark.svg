<text x="74" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ecea" text-anchor="start">tersangkut di hub Pos Laju Shah Alam.</text>
<text x="74" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ecea" text-anchor="start">Dijangka sampai esok. Kalau esok masih tak</text>
