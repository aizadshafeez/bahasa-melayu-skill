<text x="630" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ecea" text-anchor="start">Shah Alam. Sepatutnya esok sampai. Kalau</text>
