<text x="630" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5ccfc4" text-anchor="start">WITH THE SKILL</text>
<text x="630" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ecea" text-anchor="start">Maaf cik, bukan scam ye. Saya dah check,</text>
